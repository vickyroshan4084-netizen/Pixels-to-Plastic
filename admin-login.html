<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Pixels to Plastic</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#e8533c;--dark:#0d0d0d;--mid:#2a2a2c;
  --border:#e5e0d8;--light:#fdf9f6;
  --fd:'Playfair Display',serif;--fb:'DM Sans',sans-serif;
  --success:#27ae60;--danger:#e74c3c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:linear-gradient(135deg,var(--dark) 0%,#1a1a2e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.card{background:#fff;padding:2.5rem;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.4);max-width:440px;width:92%}
.back{margin-bottom:1.2rem}
.back a{color:var(--coral);text-decoration:none;font-weight:600;font-size:.88rem}
.logo{text-align:center;margin-bottom:1.8rem}
.logo h1{font-family:var(--fd);font-size:1.9rem;margin-bottom:.25rem}
.logo h1 span{color:var(--coral)}
.logo p{color:#888;font-size:.88rem}

/* Role toggle */
.role-toggle{display:flex;background:#f5f0eb;border-radius:10px;padding:4px;margin-bottom:1.8rem;position:relative}
.role-slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--coral);border-radius:7px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 8px rgba(232,83,60,.35)}
.role-slider.admin{transform:translateX(100%)}
.role-btn{flex:1;padding:10px 0;border:none;background:transparent;color:#888;font-family:var(--fb);font-size:.88rem;font-weight:600;cursor:pointer;border-radius:7px;position:relative;z-index:1;transition:color .2s}
.role-btn.on{color:#fff}

/* Sub-tabs */
.stabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.stab{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:.75rem;cursor:pointer;font-family:var(--fb);font-weight:600;color:#aaa;font-size:.88rem;transition:all .2s;margin-bottom:-2px}
.stab.on{color:var(--coral);border-bottom-color:var(--coral)}

/* Panels */
.panel{display:none}
.panel.on{display:block;animation:fi .2s ease}
.sp{display:none}
.sp.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.form-group{margin-bottom:1.1rem}
label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.85rem;color:#555}
input{width:100%;padding:.78rem;border:1.5px solid var(--border);border-radius:7px;font-family:var(--fb);font-size:.93rem;transition:border-color .2s;color:var(--dark)}
input:focus{outline:none;border-color:var(--coral)}
input::placeholder{color:#bbb}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}

.btn{width:100%;background:var(--coral);color:#fff;border:none;padding:.88rem;border-radius:7px;font-family:var(--fb);font-weight:700;font-size:.95rem;cursor:pointer;transition:background .2s;margin-top:.3rem}
.btn:hover{background:#c93d28}
.btn:disabled{background:#ccc;cursor:not-allowed}

.alert{padding:.75rem 1rem;border-radius:7px;margin-bottom:1.2rem;font-size:.88rem;display:none}
.alert.error{background:#fff0ee;color:var(--danger);border:1px solid #ffd6d0;display:block}
.alert.success{background:#efffee;color:var(--success);border:1px solid #c3f0c3;display:block}

.note-box{background:#fff8f7;border:1px solid #ffd6d0;border-radius:7px;padding:.9rem 1rem;margin-top:1.2rem;font-size:.82rem;color:#888;line-height:1.6}
.note-box strong{color:var(--coral)}
.center-link{text-align:center;margin-top:1rem;font-size:.85rem;color:#888}
.center-link a{color:var(--coral);font-weight:600;cursor:pointer;text-decoration:none}
</style>
</head>
<body>

<div class="card">
  <div class="back"><a href="index.html">← Back to Shop</a></div>
  <div class="logo">
    <h1>Pixels to <span>Plastic</span></h1>
    <p>Sign in to your account</p>
  </div>

  <!-- Role Toggle -->
  <div class="role-toggle">
    <div class="role-slider" id="slider"></div>
    <button class="role-btn on" id="btnUser" onclick="setRole('user')">👤 Customer</button>
    <button class="role-btn" id="btnAdmin" onclick="setRole('admin')">🔐 Admin</button>
  </div>

  <div id="alert" class="alert"></div>

  <!-- ── CUSTOMER PANEL ── -->
  <div class="panel on" id="pUser">
    <div class="stabs" id="stUser">
      <button class="stab on" onclick="setSub('user','login',0)">Sign In</button>
      <button class="stab" onclick="setSub('user','reg',1)">Register</button>
    </div>

    <!-- Customer Login -->
    <div class="sp on" id="user-login">
      <div class="form-group"><label>Username</label>
        <input type="text" id="cUsername" placeholder="your_username" autocomplete="username">
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="cPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" onclick="doCustomerLogin()">Sign In</button>
    </div>

    <!-- Customer Register -->
    <div class="sp" id="user-reg">
      <div class="row2">
        <div class="form-group"><label>First Name</label>
          <input type="text" id="rFN" placeholder="First">
        </div>
        <div class="form-group"><label>Last Name</label>
          <input type="text" id="rLN" placeholder="Last">
        </div>
      </div>
      <div class="form-group"><label>Username</label>
        <input type="text" id="rU" placeholder="choose_a_username">
      </div>
      <div class="form-group"><label>Email</label>
        <input type="email" id="rE" placeholder="you@email.com">
      </div>
      <div class="form-group"><label>Phone (optional)</label>
        <input type="tel" id="rPh" placeholder="Mobile number" maxlength="15">
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="rP" placeholder="Min 6 characters">
      </div>
      <button class="btn" id="btnReg" onclick="doRegister()">Create Account</button>
    </div>
  </div>

  <!-- ── ADMIN PANEL ── -->
  <div class="panel" id="pAdmin">
    <div class="stabs" id="stAdmin">
      <button class="stab on" onclick="setSub('admin','login',0)">Sign In</button>
      <button class="stab" onclick="setSub('admin','reg',1)">Register</button>
    </div>

    <!-- Admin Login -->
    <div class="sp on" id="admin-login">
      <div class="form-group"><label>Admin Username</label>
        <input type="text" id="aUsername" placeholder="admin_username" autocomplete="username">
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="aPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btnAdminLogin" onclick="doAdminLogin()">Access Dashboard</button>
    </div>

    <!-- Admin Register -->
    <div class="sp" id="admin-reg">
      <div class="note-box">
        🔑 Need the <strong>Admin Secret Key</strong> from the site owner to register.
      </div>
      <div class="form-group" style="margin-top:1rem"><label>Username</label>
        <input type="text" id="arU" placeholder="admin_username">
      </div>
      <div class="form-group"><label>Email</label>
        <input type="email" id="arE" placeholder="admin@company.com">
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="arP" placeholder="Strong password">
      </div>
      <div class="form-group"><label>Admin Secret Key</label>
        <input type="password" id="arK" placeholder="Secret key">
      </div>
      <button class="btn" id="btnAdminReg" onclick="doAdminRegister()">Register as Admin</button>
    </div>
  </div>
</div>

<script src="api-client.js"></script>
<script>
let curRole = 'user';

function setRole(r) {
  curRole = r;
  const isAdmin = r === 'admin';
  document.getElementById('slider').classList.toggle('admin', isAdmin);
  document.getElementById('btnUser').classList.toggle('on', !isAdmin);
  document.getElementById('btnAdmin').classList.toggle('on', isAdmin);
  document.getElementById('pUser').classList.toggle('on', !isAdmin);
  document.getElementById('pAdmin').classList.toggle('on', isAdmin);
  clearAlert();
}

function setSub(role, tab, idx) {
  const panelId = role === 'user' ? 'pUser' : 'pAdmin';
  const stId    = role === 'user' ? 'stUser' : 'stAdmin';
  const prefix  = role;
  document.querySelectorAll(`#${panelId} .sp`).forEach(p => p.classList.remove('on'));
  document.querySelectorAll(`#${stId} .stab`).forEach((b,i) => b.classList.toggle('on', i===idx));
  document.getElementById(`${prefix}-${tab}`).classList.add('on');
  clearAlert();
}

function showAlert(msg, type='error') {
  const a = document.getElementById('alert');
  a.textContent = msg;
  a.className = 'alert ' + type;
}
function clearAlert() {
  const a = document.getElementById('alert');
  a.className = 'alert';
}

/* ── Customer Login ── */
async function doCustomerLogin() {
  const username = document.getElementById('cUsername').value.trim();
  const password = document.getElementById('cPassword').value;
  if (!username || !password) return showAlert('Please enter username and password.');
  try {
    const data = await api.post(API_CONFIG.AUTH.LOGIN, {username, password});
    localStorage.setItem('access_token', data.access);
    localStorage.setItem('refresh_token', data.refresh || '');
    localStorage.setItem('user', JSON.stringify(data.user));
    showAlert('✓ Signed in! Redirecting…', 'success');
    setTimeout(() => {
      window.location.href = data.user?.is_staff ? 'admin.html' : 'index.html';
    }, 800);
  } catch(e) {
    showAlert(formatErrorMessage(e));
  }
}

/* ── Customer Register ── */
async function doRegister() {
  const first_name = document.getElementById('rFN').value.trim();
  const last_name  = document.getElementById('rLN').value.trim();
  const username   = document.getElementById('rU').value.trim();
  const email      = document.getElementById('rE').value.trim();
  const phone      = document.getElementById('rPh').value.trim();
  const password   = document.getElementById('rP').value;

  if (!username || !email || !password) return showAlert('Username, email and password are required.');
  if (password.length < 6) return showAlert('Password must be at least 6 characters.');

  const btn = document.getElementById('btnReg');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    await api.post(API_CONFIG.AUTH.REGISTER, {
      username, email, password, first_name, last_name, phone
    });
    showAlert('✓ Account created! You can now sign in.', 'success');
    setTimeout(() => {
      document.getElementById('cUsername').value = username;
      setSub('user', 'login', 0);
    }, 1400);
  } catch(e) {
    showAlert(formatErrorMessage(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

/* ── Admin Login ── */
async function doAdminLogin() {
  const username = document.getElementById('aUsername').value.trim();
  const password = document.getElementById('aPassword').value;
  if (!username || !password) return showAlert('Enter admin username and password.');
  const btn = document.getElementById('btnAdminLogin');
  btn.disabled = true; btn.textContent = 'Verifying…';
  try {
    const data = await api.post(API_CONFIG.AUTH.LOGIN, {username, password});
    if (!data.user?.is_staff) throw new Error('This account does not have admin privileges.');
    localStorage.setItem('access_token', data.access);
    localStorage.setItem('refresh_token', data.refresh || '');
    localStorage.setItem('user', JSON.stringify(data.user));
    showAlert('✓ Admin access granted! Redirecting…', 'success');
    setTimeout(() => window.location.href = 'admin.html', 800);
  } catch(e) {
    showAlert(formatErrorMessage(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Access Dashboard';
  }
}

/* ── Admin Register ── */
async function doAdminRegister() {
  const username  = document.getElementById('arU').value.trim();
  const email     = document.getElementById('arE').value.trim();
  const password  = document.getElementById('arP').value;
  const admin_key = document.getElementById('arK').value;
  if (!username || !email || !password || !admin_key) return showAlert('All fields are required.');
  const btn = document.getElementById('btnAdminReg');
  btn.disabled = true; btn.textContent = 'Registering…';
  try {
    await api.post(API_CONFIG.AUTH.ADMIN_REGISTER, {username, email, password, admin_key});
    showAlert('✓ Admin registered! Please sign in.', 'success');
    setTimeout(() => setSub('admin', 'login', 0), 1400);
  } catch(e) {
    showAlert(formatErrorMessage(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Register as Admin';
  }
}

/* Enter key support */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  document.querySelector('.sp.on .btn:not(:disabled)')?.click();
});

/* ── Auto-redirect ONLY if token is fresh (check validity) ── */
(async () => {
  const token = localStorage.getItem('access_token');
  const user  = JSON.parse(localStorage.getItem('user') || 'null');
  if (!token || !user) return; // no session → stay on login page

  // Verify token is still valid before redirecting
  try {
    await fetch((typeof API_CONFIG !== 'undefined' ? API_CONFIG.BASE_URL : 'http://localhost:8000/api') + '/auth/profile/', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(r => {
      if (r.ok) {
        window.location.href = user.is_staff ? 'admin.html' : 'index.html';
      } else {
        // Token expired — clear and stay
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');
      }
    });
  } catch(e) {
    // Backend unreachable — don't redirect
  }
})();
</script>
</body>
</html>
