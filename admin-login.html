<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Pixels to Plastic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b0f;--card:#13131a;--border:#1e1e2a;--accent:#ff6b35;--gold:#ffbe0b;--text:#f0f0f8;--muted:#6b6b80;--err:#ff4466;--ok:#3dffa0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 15% 15%,rgba(255,107,53,.13) 0%,transparent 55%),radial-gradient(ellipse 60% 70% at 85% 85%,rgba(255,190,11,.08) 0%,transparent 55%);pointer-events:none}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none}
.orb1{width:280px;height:280px;background:rgba(255,107,53,.2);top:-80px;left:-80px;animation:drift 8s ease-in-out infinite}
.orb2{width:240px;height:240px;background:rgba(255,190,11,.15);bottom:-60px;right:-60px;animation:drift 10s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,18px)}}
.wrap{width:100%;max-width:460px;padding:16px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:44px 40px;box-shadow:0 50px 100px rgba(0,0,0,.7);animation:up .5s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:5px}
.brand-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--gold));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px}
.brand-name span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--muted);margin-bottom:34px;padding-left:51px}
.toggle{display:flex;background:#0d0d14;border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:30px;position:relative}
.t-slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--accent);border-radius:11px;transition:all .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(255,107,53,.35)}
.t-slider.admin{transform:translateX(100%);background:var(--gold);box-shadow:0 4px 20px rgba(255,190,11,.35)}
.t-btn{flex:1;padding:11px 0;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border-radius:11px;position:relative;z-index:1;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.t-btn.on{color:#fff;font-weight:600}
.panel{display:none;animation:fi .22s ease}
.panel.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.stabs{display:flex;gap:0;margin-bottom:26px;border-bottom:1px solid var(--border)}
.stab{padding:9px 16px 11px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;font-family:'DM Sans',sans-serif}
.stab.on{color:var(--accent);border-color:var(--accent)}
.admin-mode .stab.on{color:var(--gold);border-color:var(--gold)}
.sp{display:none}
.sp.on{display:block;animation:fi .2s ease}
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
input{width:100%;background:#0d0d14;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.admin-mode input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,190,11,.1)}
input::placeholder{color:#2a2a3a}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;margin-top:4px;padding:14px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:opacity .2s,transform .1s;box-shadow:0 8px 24px rgba(255,107,53,.3)}
.btn:hover{opacity:.87}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.admin-mode .btn{background:var(--gold);color:#111;box-shadow:0 8px 24px rgba(255,190,11,.3)}
.note{background:#0d0d14;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.note strong{color:var(--gold)}
#toast{position:fixed;top:20px;right:20px;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:500;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;z-index:999;max-width:300px}
#toast.show{opacity:1;transform:none}
#toast.ok{background:#0d2b1e;border:1px solid var(--ok);color:var(--ok)}
#toast.err{background:#2b0d14;border:1px solid var(--err);color:var(--err)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
<div class="card" id="card">

  <div class="brand">
    <div class="brand-icon">🖨️</div>
    <div class="brand-name">Pixels to <span>Plastic</span></div>
  </div>
  <div class="tagline">3D Printing Marketplace — Sign in to continue</div>

  <div class="toggle">
    <div class="t-slider" id="slider"></div>
    <button class="t-btn on" id="btnU" onclick="setRole('user')">👤 Customer</button>
    <button class="t-btn" id="btnA" onclick="setRole('admin')">🔐 Admin</button>
  </div>

  <!-- CUSTOMER -->
  <div class="panel on" id="pUser">
    <div class="stabs" id="stUser">
      <button class="stab on" onclick="setSub('user','login',0)">Sign In</button>
      <button class="stab" onclick="setSub('user','reg',1)">Register</button>
    </div>
    <div class="sp on" id="user-login">
      <div class="field"><label>Username</label><input id="uU" placeholder="your_username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="uP" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn" id="btnUL" onclick="loginUser()">Sign In →</button>
    </div>
    <div class="sp" id="user-reg">
      <div class="r2">
        <div class="field"><label>First Name</label><input id="rFN" placeholder="First"></div>
        <div class="field"><label>Last Name</label><input id="rLN" placeholder="Last"></div>
      </div>
      <div class="field"><label>Username</label><input id="rU" placeholder="choose_username"></div>
      <div class="field"><label>Email</label><input id="rE" type="email" placeholder="you@email.com"></div>
      <div class="field"><label>Phone (optional)</label><input id="rPh" placeholder="Mobile number" maxlength="15"></div>
      <div class="field"><label>Password</label><input id="rP" type="password" placeholder="Min 6 characters"></div>
      <button class="btn" id="btnUR" onclick="registerUser()">Create Account →</button>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="panel" id="pAdmin">
    <div class="stabs" id="stAdmin">
      <button class="stab on" onclick="setSub('admin','login',0)">Sign In</button>
      <button class="stab" onclick="setSub('admin','reg',1)">Register</button>
    </div>
    <div class="sp on" id="admin-login">
      <div class="field"><label>Admin Username</label><input id="aU" placeholder="admin_username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="aP" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn" id="btnAL" onclick="loginAdmin()">Access Dashboard →</button>
    </div>
    <div class="sp" id="admin-reg">
      <div class="note">🔑 You need the <strong>Admin Secret Key</strong> to register. Get it from the site owner.</div>
      <div class="field"><label>Username</label><input id="arU" placeholder="admin_username"></div>
      <div class="field"><label>Email</label><input id="arE" type="email" placeholder="admin@company.com"></div>
      <div class="field"><label>Password</label><input id="arP" type="password" placeholder="Strong password"></div>
      <div class="field"><label>Admin Secret Key</label><input id="arK" type="password" placeholder="Secret key"></div>
      <button class="btn" id="btnAR" onclick="registerAdmin()">Register Admin →</button>
    </div>
  </div>

</div>
</div>
<div id="toast"></div>

<script>
// ── CONFIG ──
// Change this to your backend URL. For local: 'http://localhost:8000/api'
const API = (()=>{
  const h = window.location.hostname;
  if(h === 'localhost' || h === '127.0.0.1') return 'http://localhost:8000/api';
  return 'https://p2p-backend.onrender.com/api'; // ← update with your real backend
})();

let curRole = 'user';

function setRole(r){
  curRole = r;
  const adm = r === 'admin';
  document.getElementById('slider').classList.toggle('admin', adm);
  document.getElementById('card').classList.toggle('admin-mode', adm);
  document.getElementById('btnU').classList.toggle('on', !adm);
  document.getElementById('btnA').classList.toggle('on', adm);
  document.getElementById('pUser').classList.toggle('on', !adm);
  document.getElementById('pAdmin').classList.toggle('on', adm);
}

function setSub(role, tab, idx){
  const prefix = role;
  const panelId = role === 'user' ? 'pUser' : 'pAdmin';
  const stId    = role === 'user' ? 'stUser' : 'stAdmin';
  document.querySelectorAll(`#${panelId} .sp`).forEach(p=>p.classList.remove('on'));
  document.querySelectorAll(`#${stId} .stab`).forEach((b,i)=>b.classList.toggle('on', i===idx));
  document.getElementById(`${prefix}-${tab}`).classList.add('on');
}

function toast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className=`show ${type}`;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3500);
}

function setBtn(id, loading, label){
  const b = document.getElementById(id);
  b.disabled = loading; b.textContent = loading ? 'Please wait…' : label;
}

async function apiFetch(path, body){
  const r = await fetch(`${API}${path}`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  const d = await r.json();
  if(!r.ok){
    const m = d.detail || d.non_field_errors?.[0] || Object.values(d).flat()[0] || 'Something went wrong';
    throw new Error(typeof m === 'string' ? m : JSON.stringify(m));
  }
  return d;
}

function saveAndGo(data, isAdmin){
  localStorage.setItem('access_token', data.access);
  localStorage.setItem('refresh_token', data.refresh || '');
  localStorage.setItem('user', JSON.stringify(data.user));
  toast(isAdmin ? '✓ Admin access granted!' : '✓ Welcome!');
  setTimeout(()=>{ window.location.href = isAdmin ? 'admin.html' : 'index.html'; }, 900);
}

async function loginUser(){
  const u=document.getElementById('uU').value.trim(), p=document.getElementById('uP').value;
  if(!u||!p) return toast('Enter username and password','err');
  setBtn('btnUL',true,'Sign In →');
  try{ saveAndGo(await apiFetch('/auth/login/',{username:u,password:p}),false); }
  catch(e){ toast(e.message,'err'); }
  finally{ setBtn('btnUL',false,'Sign In →'); }
}

async function registerUser(){
  const fn=document.getElementById('rFN').value.trim();
  const ln=document.getElementById('rLN').value.trim();
  const u=document.getElementById('rU').value.trim();
  const e=document.getElementById('rE').value.trim();
  const ph=document.getElementById('rPh').value.trim();
  const p=document.getElementById('rP').value;
  if(!u||!e||!p) return toast('Username, email & password required','err');
  if(p.length<6) return toast('Password needs at least 6 characters','err');
  setBtn('btnUR',true,'Create Account →');
  try{
    await apiFetch('/auth/register/',{username:u,email:e,password:p,first_name:fn,last_name:ln,phone:ph});
    toast('✓ Account created! You can now sign in.');
    setTimeout(()=>{ document.getElementById('uU').value=u; setSub('user','login',0); setRole('user'); },1300);
  }catch(e){ toast(e.message,'err'); }
  finally{ setBtn('btnUR',false,'Create Account →'); }
}

async function loginAdmin(){
  const u=document.getElementById('aU').value.trim(), p=document.getElementById('aP').value;
  if(!u||!p) return toast('Enter admin credentials','err');
  setBtn('btnAL',true,'Access Dashboard →');
  try{
    const data = await apiFetch('/auth/login/',{username:u,password:p});
    if(!data.user?.is_staff) throw new Error('This account has no admin privileges');
    saveAndGo(data, true);
  }catch(e){ toast(e.message,'err'); }
  finally{ setBtn('btnAL',false,'Access Dashboard →'); }
}

async function registerAdmin(){
  const u=document.getElementById('arU').value.trim();
  const e=document.getElementById('arE').value.trim();
  const p=document.getElementById('arP').value;
  const k=document.getElementById('arK').value;
  if(!u||!e||!p||!k) return toast('All fields required','err');
  setBtn('btnAR',true,'Register Admin →');
  try{
    await apiFetch('/auth/admin-register/',{username:u,email:e,password:p,admin_key:k});
    toast('✓ Admin registered! Please sign in.');
    setTimeout(()=>setSub('admin','login',0),1300);
  }catch(e){ toast(e.message,'err'); }
  finally{ setBtn('btnAR',false,'Register Admin →'); }
}

// Enter key
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  document.querySelector('.sp.on .btn')?.click();
});

// Skip login if already authenticated
try{
  const u = JSON.parse(localStorage.getItem('user')||'null');
  if(u) window.location.href = u.is_staff ? 'admin.html' : 'index.html';
}catch(e){ localStorage.clear(); }
</script>
</body>
</html>
